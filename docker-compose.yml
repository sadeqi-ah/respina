name: respina

# Full stack (plan §3.1). Each service gets only the variables it reads, never the whole .env:
# the frontend has no database password, the PHP module has no private key.
# Start order follows health, not just container start:
#   db (pg_isready) → backend (migrations done, gunicorn up) → frontend, health, php
# health and php wait for backend because their database grants come from a Django migration.

x-restart: &restart
  restart: unless-stopped

services:
  db:
    <<: *restart
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      HEALTH_DB_USER: ${HEALTH_DB_USER:?set in .env}
      HEALTH_DB_PASSWORD: ${HEALTH_DB_PASSWORD:?set in .env}
      PHP_DB_USER: ${PHP_DB_USER:?set in .env}
      PHP_DB_PASSWORD: ${PHP_DB_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:5432:5432" # local tools and backend tests only; not reachable from the network
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  backend:
    <<: *restart
    build: ./backend
    image: respina-backend:dev
    environment: &backend-env
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set in .env}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-false}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:?set in .env}
      DATABASE_URL: ${DATABASE_URL:?set in .env}
      JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private.pem
      JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public.pem
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-15}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-7}
      DB_LOCK_TIMEOUT: ${DB_LOCK_TIMEOUT:-3s}
    secrets: &backend-secrets
      - source: jwt_private
        target: jwt_private.pem
      - source: jwt_public
        target: jwt_public.pem
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Healthcheck comes from the image (GET /healthz, which pings the database).

  frontend:
    <<: *restart
    build: ./frontend
    image: respina-frontend:dev
    environment:
      DJANGO_API_URL: http://backend:8000
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

  health:
    <<: *restart
    build: ./health-service
    image: respina-health:dev
    environment:
      HEALTH_PORT: "8080"
      HEALTH_DATA_SOURCE: ${HEALTH_DATA_SOURCE:-postgres}
      HEALTH_DATABASE_URL: ${HEALTH_DATABASE_URL:?set in .env}
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy # health_ro's SELECT grant is a Django migration

  php:
    <<: *restart
    build:
      context: ./php-module
      dockerfile: docker/Dockerfile
      target: prod
    image: respina-php:dev
    environment:
      PHP_DB_DSN: ${PHP_DB_DSN:?set in .env}
      PHP_DB_USER: ${PHP_DB_USER:?set in .env}
      PHP_DB_PASSWORD: ${PHP_DB_PASSWORD:?set in .env}
      JWT_PUBLIC_KEY_PATH_PHP: /run/secrets/jwt_public.pem
      DJANGO_API_URL_PHP: http://backend:8000
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      DB_LOCK_TIMEOUT: ${DB_LOCK_TIMEOUT:-3s}
    secrets:
      - source: jwt_public # verify only: the PHP module can never sign a token
        target: jwt_public.pem
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy

  # One-shot: `make seed` (docker compose --profile seed run --rm seed). Same image as backend.
  seed:
    image: respina-backend:dev
    profiles: [seed]
    restart: "no"
    environment:
      <<: *backend-env
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:?set in .env}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?set in .env}
      SEED_CUSTOMER_PASSWORD: ${SEED_CUSTOMER_PASSWORD:?set in .env}
      SEED_ALLOW_RESET: ${SEED_ALLOW_RESET:-}
    secrets: *backend-secrets
    entrypoint: ["python", "manage.py", "seed"]
    depends_on:
      backend:
        condition: service_healthy # migrations applied

secrets:
  jwt_private:
    file: ./secrets/jwt_private.pem
  jwt_public:
    file: ./secrets/jwt_public.pem

volumes:
  db-data:
