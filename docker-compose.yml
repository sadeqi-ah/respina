name: respina

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      HEALTH_DB_USER: ${HEALTH_DB_USER:?set in .env}
      HEALTH_DB_PASSWORD: ${HEALTH_DB_PASSWORD:?set in .env}
      PHP_DB_USER: ${PHP_DB_USER:?set in .env}
      PHP_DB_PASSWORD: ${PHP_DB_PASSWORD:?set in .env}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  db-data:
